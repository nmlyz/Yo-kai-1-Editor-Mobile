<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>yw1</title>
<link rel="stylesheet" href="style.css?v=31">
</head>
<body>
<div id="app">
  <header id="hdr">
    <div id="hdrMain">
      <div id="title">yw1</div>
      <div id="status">準備中...</div>
    </div>
    <button id="menuBtn" aria-label="メニュー">☰</button>
  </header>
  <div id="backBar" hidden><button id="backBtn">‹ メインメニュー</button><span id="backTitle"></span></div>
  <div id="card">
    <div id="cardMain">
      <button id="cardName">未取得</button>
      <div id="cardSub"></div>
    </div>
    <button id="moneyPill">¥ ---</button>
  </div>
  <div id="cardMeta">
    <button id="playChip">⏱ プレイ ---</button>
    <button id="diaryChip">📖 日記 ---</button>
  </div>
  <div id="actions">
    <button id="btnFetch" class="act blue">取得</button>
    <button id="btnUpload" class="act orange">アップロード</button>
    <button id="btnRestore" class="act dark">復元</button>
    <button id="btnAccount" class="act dark">アカウント</button>
  </div>
  <div id="slotSeg" class="seg"></div>
  <div id="modeSeg" class="seg">
    <button data-mode="item">アイテム</button>
    <button data-mode="yokai">ようかい</button>
    <button data-mode="quest">クエスト</button>
    <button data-mode="cheat">チート</button>
  </div>
  <div id="catSeg" class="seg small"></div>
  <div id="yokaiBar" class="toolbar" hidden>
    <button id="btnSort">並び替え: 入手順</button>
    <button id="btnRev">降順</button>
    <button id="btnMajimeAll">全員超まじめ</button>
  </div>
  <div id="questBar" class="toolbar" hidden>
    <button id="btnQAll">全クリア</button>
    <button id="btnQNone">全未クリア</button>
    <button id="btnTAll">たのみ全クリア</button>
    <button id="btnTNone">たのみ全未クリア</button>
  </div>
  <div id="searchWrap" hidden><input id="searchBox" type="search" placeholder="検索"></div>
  <main id="list"></main>
  <footer id="foot">編集内容は「アップロード」を押すまでゲームに反映されません</footer>
</div>
<div id="toast"></div>
<div id="modalWrap" hidden>
  <div id="modalCard">
    <div id="modalTitle"></div>
    <div id="modalBody"></div>
    <div id="modalBtns"></div>
  </div>
</div>
<input type="file" id="filePick" accept=".bin" hidden>
<script src="r.js?v=31"></script>
</body>
</html>
